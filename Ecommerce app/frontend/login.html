<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — ShopFlask</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<nav class="navbar">
  <div class="container navbar-inner">
    <a href="/index.html" class="navbar-brand">🛍️ <span>ShopFlask</span></a>
    <ul class="navbar-nav"></ul>
    <div class="navbar-auth">
      <a href="/register.html" class="btn btn-ghost btn-sm">Create account</a>
    </div>
  </div>
</nav>

<main>
  <div class="auth-page">
    <div class="card auth-card">
      <div class="card-body">
        <div class="auth-logo">🛍️ ShopFlask</div>
        <h1 class="auth-title">Welcome back</h1>
        <p class="auth-subtitle">Sign in to your account to continue shopping</p>

        <div class="alert alert-danger flash-message" id="login-error" role="alert">
          <span class="alert-icon">❌</span>
          <span id="login-error-text">Invalid email or password.</span>
        </div>

        <form id="login-form" novalidate>
          <div class="form-group">
            <label class="form-label" for="email">Email address</label>
            <input type="email" class="form-control" id="email" name="email"
                   placeholder="you@example.com" autocomplete="email" required>
            <span class="form-error" id="email-error"></span>
          </div>
          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input type="password" class="form-control" id="password" name="password"
                   placeholder="••••••••" autocomplete="current-password" required>
            <span class="form-error" id="password-error"></span>
          </div>

          <button type="submit" class="btn btn-primary btn-full" id="login-btn">
            Sign in
          </button>
        </form>

        <p class="auth-link">Don't have an account? <a href="/register.html">Register here</a></p>
      </div>
    </div>
  </div>
</main>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script>
  // Redirect if already logged in
  if (Auth.isLoggedIn()) window.location.href = '/index.html';

  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('login-btn');
    const errorDiv = document.getElementById('login-error');
    const errorText = document.getElementById('login-error-text');
    errorDiv.classList.remove('show');

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    // Client-side pre-checks
    let valid = true;
    if (!email) { showFieldError('email-error', 'Email is required'); valid = false; }
    if (!password) { showFieldError('password-error', 'Password is required'); valid = false; }
    if (!valid) return;

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Signing in…';

    try {
      const data = await API.post('/api/auth/login', { email, password });
      Auth.saveToken(data.data.access_token, data.data.user);
      window.location.href = '/index.html';
    } catch (err) {
      errorText.textContent = err.message || 'Invalid email or password.';
      errorDiv.classList.add('show');
      btn.disabled = false;
      btn.innerHTML = 'Sign in';
    }
  });

  function showFieldError(id, msg) {
    const el = document.getElementById(id);
    el.textContent = msg;
    el.classList.add('visible');
  }
</script>
</body>
</html>
