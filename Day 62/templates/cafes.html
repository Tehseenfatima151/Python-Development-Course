{% extends 'base.html' %}

{% block content %}
    <h1 class="mb-4">All Cafes ☕</h1>
    <a href="{{ url_for('add_cafe') }}" class="btn btn-success mb-3">Add New Cafe</a>

    <table class="table table-striped">
        <thead>
            <tr>
                <th>Cafe</th>
                <th>Location</th>
                <th>Open</th>
                <th>Close</th>
                <th>Coffee</th>
                <th>Wifi</th>
                <th>Power</th>
            </tr>
        </thead>
        <tbody>
            {% for cafe in cafes %}
            <tr>
                <td>{{ cafe[0] }}</td>
                <td><a href="{{ cafe[1] }}" target="_blank">Map</a></td>
                <td>{{ cafe[2] }}</td>
                <td>{{ cafe[3] }}</td>
                <td>{{ cafe[4] }}</td>
                <td>{{ cafe[5] }}</td>
                <td>{{ cafe[6] }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
{% endblock %}
