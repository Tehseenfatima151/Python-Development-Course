<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — ShopFlask</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<nav class="navbar">
  <div class="container navbar-inner">
    <a href="/index.html" class="navbar-brand">🛍️ <span>ShopFlask</span></a>
    <ul class="navbar-nav"></ul>
    <div class="navbar-auth">
      <a href="/login.html" class="btn btn-ghost btn-sm">Sign in</a>
    </div>
  </div>
</nav>

<main>
  <div class="auth-page">
    <div class="card auth-card">
      <div class="card-body">
        <div class="auth-logo">🛍️ ShopFlask</div>
        <h1 class="auth-title">Create your account</h1>
        <p class="auth-subtitle">Join thousands of shoppers on ShopFlask</p>

        <div class="alert alert-danger flash-message" id="register-error" role="alert">
          <span class="alert-icon">❌</span>
          <span id="register-error-text"></span>
        </div>
        <div class="alert alert-success flash-message" id="register-success" role="alert">
          <span class="alert-icon">✅</span>
          <span>Account created! Redirecting…</span>
        </div>

        <form id="register-form" novalidate>
          <div class="form-group">
            <label class="form-label" for="name">Full name</label>
            <input type="text" class="form-control" id="name" name="name"
                   placeholder="Jane Smith" autocomplete="name" required>
            <span class="form-error" id="name-error"></span>
          </div>
          <div class="form-group">
            <label class="form-label" for="email">Email address</label>
            <input type="email" class="form-control" id="email" name="email"
                   placeholder="you@example.com" autocomplete="email" required>
            <span class="form-error" id="email-error"></span>
          </div>
          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input type="password" class="form-control" id="password" name="password"
                   placeholder="Minimum 8 characters" autocomplete="new-password" required>
            <span class="form-error" id="password-error"></span>
          </div>

          <button type="submit" class="btn btn-primary btn-full" id="register-btn">
            Create account
          </button>
        </form>

        <p class="auth-link">Already have an account? <a href="/login.html">Sign in</a></p>
      </div>
    </div>
  </div>
</main>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script>
  if (Auth.isLoggedIn()) window.location.href = '/index.html';

  document.getElementById('register-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    clearErrors();
    const btn = document.getElementById('register-btn');
    const errDiv = document.getElementById('register-error');
    const errText = document.getElementById('register-error-text');
    errDiv.classList.remove('show');

    const name = document.getElementById('name').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    let valid = true;
    if (!name) { showFieldError('name-error', 'Name is required'); valid = false; }
    if (!email) { showFieldError('email-error', 'Email is required'); valid = false; }
    if (password.length < 8) { showFieldError('password-error', 'Password must be at least 8 characters'); valid = false; }
    if (!valid) return;

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Creating account…';

    try {
      const data = await API.post('/api/auth/register', { name, email, password });
      Auth.saveToken(data.data.access_token, data.data.user);
      document.getElementById('register-success').classList.add('show');
      setTimeout(() => window.location.href = '/index.html', 1200);
    } catch (err) {
      // Show field-level errors if available
      if (err.errors) {
        Object.entries(err.errors).forEach(([field, msg]) => {
          const el = document.getElementById(field + '-error');
          if (el) { el.textContent = msg; el.classList.add('visible'); }
        });
      } else {
        errText.textContent = err.message || 'Registration failed. Please try again.';
        errDiv.classList.add('show');
      }
      btn.disabled = false;
      btn.innerHTML = 'Create account';
    }
  });

  function showFieldError(id, msg) {
    const el = document.getElementById(id);
    el.textContent = msg; el.classList.add('visible');
  }
  function clearErrors() {
    document.querySelectorAll('.form-error').forEach(e => { e.textContent = ''; e.classList.remove('visible'); });
  }
</script>
</body>
</html>
