# ---------------------------------------------------------------------------
# CI/CD Pipeline - Dockerized Flask Application
#
# This workflow lives at the repository root (.github/workflows/ci-cd.yml)
# so that GitHub Actions can detect it. All commands operate inside the
# project subdirectory: "docker app/"
#
# Pipeline stages:
#   1. test         - install Python deps, run pytest
#   2. docker-build - build Docker image (only after tests pass)
#   3. deploy       - trigger Render deployment (only on main, after build)
# ---------------------------------------------------------------------------

name: CI/CD Pipeline

on:
  push:
    branches: ["**"]          # Run tests + build on every branch push
    paths:
      - "docker app/**"                 # Trigger when project files change
      - ".github/workflows/ci-cd.yml"  # Also trigger when this workflow changes
  pull_request:
    branches: [main]          # Run tests + build on PRs targeting main
    paths:
      - "docker app/**"
      - ".github/workflows/ci-cd.yml"

jobs:
  # -------------------------------------------------------------------------
  # Job 1: Run automated tests
  # -------------------------------------------------------------------------
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: "docker app"   # All run steps operate inside this dir

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "docker app/requirements.txt"

      - name: Install dependencies
        run: pip install -r requirements.txt   # resolves to: docker app/requirements.txt

      - name: Run pytest
        run: pytest -v                         # runs inside: docker app/

  # -------------------------------------------------------------------------
  # Job 2: Build and validate the Docker image
  # -------------------------------------------------------------------------
  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test               # Only runs if the test job succeeds

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: "./docker app"              # Build context is the project subdir
          file: "./docker app/Dockerfile"      # Explicit Dockerfile path
          push: false                          # Build and validate only
          tags: dockerized-flask-cicd:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the container
        run: |
          # Build using the project subdir as context (quotes handle the space)
          docker build -t flask-smoke-test "./docker app"

          # Start the container in detached mode with a safe test secret
          docker run -d \
            --name flask-test \
            -p 5000:5000 \
            -e FLASK_ENV=production \
            -e SECRET_KEY=ci-smoke-test-key \
            flask-smoke-test

          # Wait up to 30 s for the application to be ready
          echo "Waiting for container to start..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5000/health > /dev/null 2>&1; then
              echo "Container is healthy after ${i}s"
              break
            fi
            sleep 1
          done

          # Assert /health returns 200 and {"status":"healthy"}
          HEALTH=$(curl -sf http://localhost:5000/health)
          echo "Health response: $HEALTH"
          echo "$HEALTH" | grep -q '"healthy"' || (echo "Health check failed" && exit 1)

          # Assert / returns 200
          ROOT=$(curl -sf http://localhost:5000/)
          echo "Root response: $ROOT"
          echo "$ROOT" | grep -q '"running"' || (echo "Root endpoint check failed" && exit 1)

          echo "All smoke tests passed."

      - name: Stop and remove test container
        if: always()
        run: |
          docker stop flask-test || true
          docker rm flask-test || true

  # -------------------------------------------------------------------------
  # Job 3: Deploy to Render
  # Triggered only when pushing to the main branch AND both previous jobs pass.
  #
  # Required GitHub Secret:
  #   RENDER_DEPLOY_HOOK_URL - the deploy hook URL from your Render service.
  #   Add it at: Settings -> Secrets and variables -> Actions -> New repository secret
  # -------------------------------------------------------------------------
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: [test, docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Trigger Render deployment
        run: |
          echo "Triggering deployment to Render..."
          curl -s -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" \
            -o /dev/null \
            -w "HTTP status: %{http_code}\n"
          echo "Deployment request sent. Monitor progress at https://dashboard.render.com"
